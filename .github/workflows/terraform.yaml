name: "vprofile-IAC"

on:
  push:
    branches:
      - stage
      - main
    paths:
      - 'terraform/**'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

# Workflow-level environment variables (secrets referenced here)
env:
  AWS_REGION: us-east-1
  S3_BUCKET: ${{ secrets.BUCKET_TF_STATE }}

jobs:
  terraform:
    name: "Apply Terraform changes"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        # Prefer OIDC / role-to-assume in future. Using secrets here as a simple option.
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform with specific version
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.6.3"

      - name: Terraform init (backend config)
        id: init
        run: |
          terraform init -backend-config="bucket=${S3_BUCKET}" \
                         -backend-config="region=${AWS_REGION}" \
                         -backend-config="key=terraform.tfstate" \
                         -backend-config="encrypt=true"

      - name: Terraform fmt (check)
        id: fmt
        run: terraform fmt -check

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out=planfile
        continue-on-error: true

      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: exitcode 1